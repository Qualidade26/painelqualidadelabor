```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Qualidade</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b1120;color:#fff;font-family:Arial,sans-serif;padding:20px}
.header{text-align:center;font-size:32px;font-weight:bold;margin-bottom:20px}
.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#1e293b;border-radius:16px;padding:20px;box-shadow:0 8px 25px rgba(0,0,0,.35)}
.card h2{margin-bottom:15px;color:#38bdf8}
.kpi{display:flex;gap:20px;margin-bottom:15px}
.kpi-box{background:#334155;padding:15px;border-radius:12px;flex:1}
.kpi-title{font-size:14px;color:#cbd5e1}
.kpi-value{font-size:28px;font-weight:bold;margin-top:5px}
.full{grid-column:1 / span 2}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:14px}
th,td{border-bottom:1px solid #334155;padding:10px;text-align:left}
th{color:#94a3b8}
.scroll-table{max-height:350px;overflow:auto}
canvas{margin-top:15px}
</style>
</head>
<body>

<div class="header">PAINEL DE QUALIDADE</div>

<div class="dashboard">
    <div class="card">
        <h2>Quadro 1 - Descarte</h2>

        <div class="kpi">
            <div class="kpi-box">
                <div class="kpi-title">Total Descarte</div>
                <div id="totalDescarte" class="kpi-value">...</div>
            </div>
            <div class="kpi-box">
                <div class="kpi-title">Último Descarte</div>
                <div id="ultimoDescarte" class="kpi-value">...</div>
            </div>
        </div>

        <canvas id="descarteChart"></canvas>

        <div class="scroll-table">
            <table>
                <thead>
                    <tr><th>SKU</th><th>Descrição</th><th>Valor</th></tr>
                </thead>
                <tbody id="descarteTable"></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h2>Quadro 2 - Esfigmomanômetro</h2>
        <div class="scroll-table">
            <table>
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Aguardando</th>
                        <th>Desmontado</th>
                        <th>Aferidos</th>
                    </tr>
                </thead>
                <tbody id="esfigTable"></tbody>
            </table>
        </div>
    </div>

    <div class="card full">
        <h2>Quadro 3 - Amostras</h2>
        <canvas id="amostraChart"></canvas>

        <div class="scroll-table">
            <table>
                <thead>
                    <tr><th>SKU</th><th>Descrição</th><th>Qtd</th></tr>
                </thead>
                <tbody id="amostrasTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
let descarteChart;
let amostraChart;

function formatMoney(value){
    return value.toLocaleString('pt-BR',{
        style:'currency',
        currency:'BRL'
    });
}

async function carregarDados(){
    const response = await fetch('./data.json?t=' + new Date().getTime());
    const data = await response.json();

    document.getElementById("totalDescarte").innerText =
        formatMoney(data.descarte.total);

    document.getElementById("ultimoDescarte").innerText =
        formatMoney(data.descarte.ultimoDescarte);

    document.getElementById("descarteTable").innerHTML =
        data.descarte.top10.map(item => `
            <tr>
                <td>${item.sku}</td>
                <td>${item.descricao}</td>
                <td>${formatMoney(item.valor)}</td>
            </tr>
        `).join('');

    document.getElementById("esfigTable").innerHTML =
        data.esfig.map(item => `
            <tr>
                <td>${item.sku}</td>
                <td>${item.aguardando}</td>
                <td>${item.desmontado}</td>
                <td>${item.aferidos}</td>
            </tr>
        `).join('');

    document.getElementById("amostrasTable").innerHTML =
        data.amostras.top10.map(item => `
            <tr>
                <td>${item.sku}</td>
                <td>${item.descricao}</td>
                <td>${item.quantidade}</td>
            </tr>
        `).join('');

    const labelsDescarte = data.descarte.origens.map(x => x.nome);
    const valuesDescarte = data.descarte.origens.map(x => x.valor);

    if (descarteChart) descarteChart.destroy();

    descarteChart = new Chart(document.getElementById('descarteChart'), {
        type:'doughnut',
        data:{
            labels: labelsDescarte,
            datasets:[{data: valuesDescarte}]
        }
    });

    const labelsMeses = data.amostras.mensal.map(x => x.mes);
    const valoresMeses = data.amostras.mensal.map(x => x.valor);

    if (amostraChart) amostraChart.destroy();

    amostraChart = new Chart(document.getElementById('amostraChart'), {
        type:'bar',
        data:{
            labels: labelsMeses,
            datasets:[{
                label:'Amostras',
                data: valoresMeses
            }]
        }
    });
}

carregarDados();

// refresh a cada 2 minutos
setInterval(carregarDados, 120000);
</script>

</body>
</html>
```
