<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LABOR Quality Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
    --bg:#0B1120;
    --card:#111827;
    --card2:#1E293B;
    --primary:#2F54EB;
    --secondary:#60A5FA;
    --text:#F8FAFC;
    --muted:#94A3B8;
    --border:rgba(96,165,250,.12);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,#0b1120,#111827);
    color:var(--text);
    font-family:Arial, sans-serif;
    padding:20px;
}

.header{
    background:linear-gradient(145deg,#111827,#1e293b);
    border:1px solid var(--border);
    border-radius:20px;
    padding:24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
    margin-bottom:20px;
}

.logo{
    display:flex;
    gap:16px;
    align-items:center;
}

.logo-box{
    width:48px;
    height:48px;
    border-radius:14px;
    background:var(--primary);
}

.title{
    font-size:28px;
    font-weight:700;
}

.subtitle{
    color:var(--muted);
    font-size:14px;
}

.dashboard{
    display:grid;
    gap:20px;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.kpi{
    background:linear-gradient(145deg,#111827,#1e293b);
    border:1px solid var(--border);
    padding:22px;
    border-radius:18px;
}

.kpi-label{
    color:var(--muted);
    font-size:13px;
}

.kpi-value{
    font-size:34px;
    font-weight:bold;
    margin-top:10px;
}

.kpi-note{
    margin-top:8px;
    color:#60A5FA;
    font-size:12px;
}

.grid{
    display:grid;
    grid-template-columns:60% 40%;
    gap:20px;
}

.card{
    background:linear-gradient(145deg,#111827,#1e293b);
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
}

.card h2{
    margin-bottom:20px;
    font-size:22px;
}

.rank-item{
    display:flex;
    justify-content:space-between;
    background:#0f172a;
    padding:14px;
    border-radius:12px;
    margin-bottom:10px;
}

.pipeline{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.stage{
    background:#0f172a;
    padding:22px;
    border-radius:16px;
    text-align:center;
}

.stage-value{
    font-size:42px;
    font-weight:bold;
    color:var(--secondary);
}

.stage-label{
    margin-top:8px;
    color:var(--muted);
}

.full{
    width:100%;
}

canvas{
    max-height:300px !important;
}
</style>
</head>
<body>

<div class="header">
    <div class="logo">
        <div class="logo-box"></div>
        <div>
            <div class="title">LABOR Quality Dashboard</div>
            <div class="subtitle">Painel Estratégico da Qualidade</div>
        </div>
    </div>
    <div id="ultimaAtualizacao"></div>
</div>

<div class="dashboard">

    <div class="kpis">
        <div class="kpi">
            <div class="kpi-label">Total Descarte</div>
            <div class="kpi-value" id="totalDescarte"></div>
            <div class="kpi-note">Indicador financeiro</div>
        </div>

        <div class="kpi">
            <div class="kpi-label">Último Descarte</div>
            <div class="kpi-value" id="ultimoDescarte"></div>
            <div class="kpi-note">Última operação</div>
        </div>

        <div class="kpi">
            <div class="kpi-label">Amostras</div>
            <div class="kpi-value" id="totalAmostras"></div>
            <div class="kpi-note">Ano corrente</div>
        </div>

        <div class="kpi">
            <div class="kpi-label">SKUs Esfig</div>
            <div class="kpi-value" id="totalEsfig"></div>
            <div class="kpi-note">Em monitoramento</div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Descarte por Origem</h2>
            <canvas id="descarteChart"></canvas>

            <div style="margin-top:20px" id="ranking"></div>
        </div>

        <div class="card">
            <h2>Pipeline Esfigmomanômetro</h2>
            <div class="pipeline">
                <div class="stage">
                    <div class="stage-value" id="aguardandoTotal">0</div>
                    <div class="stage-label">Aguardando</div>
                </div>

                <div class="stage">
                    <div class="stage-value" id="desmontadoTotal">0</div>
                    <div class="stage-label">Desmontado</div>
                </div>

                <div class="stage">
                    <div class="stage-value" id="aferidosTotal">0</div>
                    <div class="stage-label">Aferidos</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card full">
        <h2>Tendência de Amostras</h2>
        <canvas id="amostraChart"></canvas>
    </div>

</div>

<script>
let descarteChart;
let amostraChart;

function formatMoney(value){
    return value.toLocaleString('pt-BR',{
        style:'currency',
        currency:'BRL'
    });
}

async function carregarDados(){
    const response = await fetch('./data.json?t=' + Date.now());
    const data = await response.json();

    document.getElementById('totalDescarte').innerText =
        formatMoney(data.descarte.total);

    document.getElementById('ultimoDescarte').innerText =
        formatMoney(data.descarte.ultimoDescarte);

    document.getElementById('totalAmostras').innerText =
        data.amostras.mensal.reduce((a,b)=>a+b.valor,0);

    document.getElementById('totalEsfig').innerText =
        data.esfig.length;

    document.getElementById('ultimaAtualizacao').innerText =
        "Online • " + new Date().toLocaleTimeString('pt-BR');

    const aguardando = data.esfig.reduce((a,b)=>a+b.aguardando,0);
    const desmontado = data.esfig.reduce((a,b)=>a+b.desmontado,0);
    const aferidos = data.esfig.reduce((a,b)=>a+b.aferidos,0);

    document.getElementById('aguardandoTotal').innerText = aguardando;
    document.getElementById('desmontadoTotal').innerText = desmontado;
    document.getElementById('aferidosTotal').innerText = aferidos;

    document.getElementById('ranking').innerHTML =
        data.descarte.top10.map((item,i)=>`
            <div class="rank-item">
                <span>#${i+1} ${item.sku}</span>
                <span>${formatMoney(item.valor)}</span>
            </div>
        `).join('');

    if(descarteChart) descarteChart.destroy();

    descarteChart = new Chart(document.getElementById('descarteChart'),{
        type:'bar',
        data:{
            labels:data.descarte.origens.map(x=>x.nome),
            datasets:[{
                data:data.descarte.origens.map(x=>x.valor),
                backgroundColor:'#2F54EB'
            }]
        },
        options:{
            indexAxis:'y',
            plugins:{legend:{display:false}}
        }
    });

    if(amostraChart) amostraChart.destroy();

    amostraChart = new Chart(document.getElementById('amostraChart'),{
        type:'line',
        data:{
            labels:data.amostras.mensal.map(x=>x.mes),
            datasets:[{
                data:data.amostras.mensal.map(x=>x.valor),
                borderColor:'#60A5FA',
                tension:0.4
            }]
        },
        options:{
            plugins:{legend:{display:false}}
        }
    });
}

carregarDados();
setInterval(carregarDados,120000);
</script>

</body>
</html>
